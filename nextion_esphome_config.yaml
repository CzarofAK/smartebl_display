# ESPHome Configuration for SmartEBL Nextion Display
# This code integrates INTO the SmartEBL smart-ebl.yaml configuration
#
# ARCHITECTURE:
# - SmartEBL ESP32: Single device with Nextion display attached
# - UART already configured in SmartEBL as "display_uart" (GPIO18/19)
# - Local sensors: tank1_level, tank2_level, truma sensors, switch_pump
# - External sensors: Diesel, Gas bottles, outside temp from Home Assistant

# =============================================================================
# NEXTION DISPLAY CONFIGURATION
# =============================================================================
# NOTE: UART is already configured in SmartEBL as display_uart
# uart:
#   - id: display_uart
#     tx_pin: GPIO18
#     rx_pin: GPIO19
#     baud_rate: 115200

display:
  - platform: nextion
    id: nextion_display
    uart_id: display_uart  # Reference existing UART from SmartEBL
    update_interval: 1s

    # Lambda for regular updates (runs every update_interval)
    lambda: |-
      // Status bar updates (time, date, temperatures)
      it.set_component_text("txt_status_bar", id(status_text).state.c_str());

      // === LEVELS PAGE UPDATES ===
      // Freshwater tank (LOCAL SmartEBL sensor: tank1_level)
      it.set_component_value("bar_fresh", id(tank1_level).state);
      it.set_component_value("bar_fresh_big", id(tank1_level).state);
      it.set_component_text_printf("val_fresh", "%.0f%%", id(tank1_level).state);
      it.set_component_text_printf("val_fresh_big", "%.0f%%", id(tank1_level).state);

      // Greywater tank (LOCAL SmartEBL sensor: tank2_level)
      it.set_component_value("bar_grey", id(tank2_level).state);
      it.set_component_value("bar_grey_big", id(tank2_level).state);
      it.set_component_text_printf("val_grey", "%.0f%%", id(tank2_level).state);
      it.set_component_text_printf("val_grey_big", "%.0f%%", id(tank2_level).state);

      // Diesel tank (EXTERNAL from Home Assistant)
      it.set_component_value("bar_diesel", id(diesel_level).state);
      it.set_component_text_printf("val_diesel", "%.0f%%", id(diesel_level).state);

      // Gas 1 tank (EXTERNAL from Home Assistant)
      it.set_component_value("bar_gas1", id(gas1_level).state);
      it.set_component_text_printf("val_gas1", "%.0f%%", id(gas1_level).state);

      // Gas 2 tank (EXTERNAL from Home Assistant)
      it.set_component_value("bar_gas2", id(gas2_level).state);
      it.set_component_text_printf("val_gas2", "%.0f%%", id(gas2_level).state);

      // NOTE: btn_pump state is synced in switch_pump turn_on/off_action
      // DO NOT update btn_pump here - it interferes with button touch detection!

# =============================================================================
# NEXTION SWITCH - Pump Button (Dual-State Button)
# =============================================================================
# Uses the ESPHome Nextion Switch component for bidirectional state sync.
# This handles BOTH directions automatically:
#   - Nextion button press → ESPHome state change → relay pulse
#   - Home Assistant/ESPHome change → Nextion button visual update
#
# NEXTION EDITOR SETUP for btn_pump:
#   1. Set vscope = global (so component is accessible from any page)
#   2. Check "Send Component ID" checkbox (optional but recommended)
#   3. Leave Touch Press Event EMPTY (no custom code needed!)
#
# The dual-state button's natural toggle behavior works WITH this component.

switch:
  # Water Pump - Nextion dual-state button with bidirectional sync
  - platform: nextion
    id: nextion_pump_switch
    name: "Water Pump"
    icon: mdi:water-pump
    component_name: Levels_2.btn_pump  # Page prefix required for global vscope
    update_interval: 100ms  # Fast sync for responsive UI
    on_turn_on:
      # Pulse the bistable relay ON coil
      - switch.turn_on: relay_pump_on_coil
    on_turn_off:
      # Pulse the bistable relay OFF coil
      - switch.turn_on: relay_pump_off_coil

# =============================================================================
# SENSORS - External sensors from Home Assistant
# =============================================================================
# NOTE: Local SmartEBL sensors are already defined in smart-ebl.yaml:
#   - id: tank1_level (Freshwater)
#   - id: tank2_level (Greywater)
#   - id: truma_room_temp (Inside temperature)
#   - id: switch_pump (Water pump)

sensor:
  # Diesel tank (from Home Assistant)
  - platform: homeassistant
    id: diesel_level
    entity_id: sensor.diesel_tank_level  # TODO: Update with actual entity_id
    internal: true

  # Gas 1 tank (from Home Assistant)
  - platform: homeassistant
    id: gas1_level
    entity_id: sensor.gas1_tank_level  # TODO: Update with actual entity_id
    internal: true

  # Gas 2 tank (from Home Assistant)
  - platform: homeassistant
    id: gas2_level
    entity_id: sensor.gas2_tank_level  # TODO: Update with actual entity_id
    internal: true

  # Outside temperature (from Home Assistant)
  - platform: homeassistant
    id: outside_temperature
    entity_id: sensor.outside_temperature  # TODO: Update with actual entity_id
    internal: true

# =============================================================================
# TEXT SENSORS - Status Bar
# =============================================================================

text_sensor:
  # Status bar text (time, date, temperatures)
  - platform: template
    id: status_text
    update_interval: 1s
    lambda: |-
      char buffer[100];
      auto time = id(homeassistant_time).now();
      auto inside_temp = id(truma_room_temp).state;  // LOCAL SmartEBL sensor
      auto outside_temp = id(outside_temperature).state;  // EXTERNAL from HA

      sprintf(buffer, "%02d:%02d:%02d  %02d.%s.%02d     In: %.0f°C  Out: %.0f°C",
        time.hour, time.minute, time.second,
        time.day_of_month, time.strftime("%b").c_str(), time.year % 100,
        inside_temp, outside_temp);

      return {buffer};

# =============================================================================
# TIME - Required for status bar clock
# =============================================================================

time:
  - platform: homeassistant
    id: homeassistant_time

# =============================================================================
# SMARTEBL INTEGRATION NOTES
# =============================================================================
# The nextion_pump_switch above REPLACES any existing switch_pump definition.
#
# If you need to keep the original switch_pump id for compatibility:
#
#   switch:
#     - platform: nextion
#       id: switch_pump  # Use the same id as before
#       name: "Water Pump"
#       component_name: Levels_2.btn_pump
#       update_interval: 100ms
#       on_turn_on:
#         - switch.turn_on: relay_pump_on_coil
#       on_turn_off:
#         - switch.turn_on: relay_pump_off_coil
#
# NO boot sync or lambda updates needed - the nextion switch handles everything!

